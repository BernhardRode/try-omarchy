<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Try Omarchy — Browser Runtime</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css"></head>
<body>
<header><div><strong>Try Omarchy</strong> <span class="badge">Browser runtime · experimental</span></div><button id="start" type="button">Start VM</button></header>
<main><section class="controls">
<label>Guest image <input id="image" type="file" accept=".img,.raw,.ext4"></label>
<label>Kernel <input id="kernel" type="file" accept=".img,.bin"></label>
<label>Initramfs <input id="initramfs" type="file" accept=".img"></label>
<p id="status">Select the ARM64 guest artifacts and start the VM. QEMU is emulated in WebAssembly.</p>
</section><div id="terminal"></div></main>
<script type="module" src="./app.js"></script>
</body></html>
