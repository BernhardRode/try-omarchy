name: Browser runtime
on:
  push:
    branches: [main]
    paths: ['browser/**', '.github/workflows/browser-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Try Omarchy
        uses: actions/checkout@v4
      - name: Check out qemu-wasm
        uses: actions/checkout@v4
        with:
          repository: ktock/qemu-wasm
          ref: master
          path: .build/qemu-wasm
      - name: Build qemu-system-aarch64.wasm
        working-directory: .build/qemu-wasm
        run: |
          docker build -t buildqemu - < Dockerfile
          docker run --rm -d --name build-qemu-wasm -v "$PWD:/qemu:ro" buildqemu
          EXTRA_CFLAGS='-O3 -DNDEBUG -D_GNU_SOURCE -matomics -mbulk-memory -sASYNCIFY=1 -pthread -sPROXY_TO_PTHREAD=1 -sFORCE_FILESYSTEM -sALLOW_TABLE_GROWTH -sTOTAL_MEMORY=2300MB -sWASM_BIGINT -sMALLOC=mimalloc --js-library=/build/node_modules/xterm-pty/emscripten-pty.js -sEXPORT_ES6=1 -sASYNCIFY_IMPORTS=ffi_call_js'
          docker exec build-qemu-wasm emconfigure /qemu/configure --static --target-list=aarch64-softmmu --cpu=wasm32 --cross-prefix= --without-default-features --enable-system --with-coroutine=fiber --enable-virtfs --extra-cflags="$EXTRA_CFLAGS" --extra-cxxflags="$EXTRA_CFLAGS" --extra-ldflags='-sEXPORTED_RUNTIME_METHODS=getTempRet0,setTempRet0,addFunction,removeFunction,TTY,FS'
          docker exec build-qemu-wasm emmake make -j2 qemu-system-aarch64
          mkdir -p "$GITHUB_WORKSPACE/browser/qemu"
          docker cp build-qemu-wasm:/build/qemu-system-aarch64 "$GITHUB_WORKSPACE/browser/qemu/out.js"
          docker cp build-qemu-wasm:/build/qemu-system-aarch64.wasm "$GITHUB_WORKSPACE/browser/qemu/"
          docker cp build-qemu-wasm:/build/qemu-system-aarch64.worker.js "$GITHUB_WORKSPACE/browser/qemu/"
          docker rm -f build-qemu-wasm
      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp -R browser/. site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
